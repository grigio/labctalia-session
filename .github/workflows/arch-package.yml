name: Arch package

# Builds the labctalia-session Arch package and attaches it to a GitHub
# release, for every release tag (v*).
#
# Triggers
#   push of a v* tag   build and publish that tag
#   workflow_dispatch  rebuild an existing tag (e.g. after fixing the packaging)
#
# The package itself is version-less: pkgver comes from the tag (v1.2.2 ->
# 1.2.2) and pkgrel from the number of commits that touched the packaging, so
# a rebuild of the same tag is still seen by pacman as an upgrade.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arch-package-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      # git has to exist before checkout, otherwise actions/checkout falls back
      # to downloading a tarball and there is no history for the pkgrel count.
      - name: Bootstrap git and gh
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git github-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          version=${TAG#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag $TAG is not v<major>.<minor>.<patch>" >&2
            exit 1
          }

          # pkgrel monotonic with packaged changes: 1, 2, 3, ...
          pkgrel=$(git rev-list --count HEAD -- \
            PKGBUILD labctalia-session.install files README.md LICENSE \
            scripts/set-default-greetd.sh scripts/install.sh)
          (( pkgrel >= 1 )) || pkgrel=1
          echo "building labctalia-session $version-$pkgrel"

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir -p /tmp/pkgout
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgout

          # --nodeps: labwc, noctalia and the portal implementations are not in
          # the official base-devel container; skipping the check keeps the
          # build focused on the packaging.
          su builder -s /bin/bash -c "
            cd '$GITHUB_WORKSPACE'
            SESSION_VERSION='$version' SESSION_PKGREL='$pkgrel' \
            PKGDEST=/tmp/pkgout \
            makepkg --nodeps --noconfirm --force
          "

      - name: Collect packages
        id: pkg
        run: |
          set -euo pipefail
          cd /tmp/pkgout
          shopt -s nullglob
          assets=()
          for file in *.pkg.tar.zst; do
            sha256sum "$file" > "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          (( ${#assets[@]} )) || { echo "no package was produced" >&2; exit 1; }
          printf '%s\n' "${assets[@]}" > /tmp/assets.txt
          cat /tmp/assets.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd /tmp/pkgout
          mapfile -t assets < /tmp/assets.txt

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            notes=$(cat <<EOF
          Arch Linux package of [Labctalia](https://github.com/$GITHUB_REPOSITORY)
          \`$TAG\`: the minimal labwc + Noctalia XDG session (launcher, session
          entry, systemd user units, portal configuration and the macos-dark
          labwc theme).

          ### Install

          \`\`\`sh
          gh release download $TAG -R $GITHUB_REPOSITORY -p '*.pkg.tar.zst*' -D /tmp/labctalia-session
          cd /tmp/labctalia-session && sha256sum -c ./*.pkg.tar.zst.sha256
          sudo pacman -U ./*.pkg.tar.zst
          \`\`\`

          The package does not change the greeter default. To make it selectable
          in a gtkgreet dropdown without changing the default:

          \`\`\`sh
          sudo labctalia-session-default --list
          \`\`\`

          Then, optionally, make it the greeter default:

          \`\`\`sh
          sudo labctalia-session-default
          \`\`\`

          Needs \`labwc\` (or \`labwc-blur\`), \`noctalia\`,
          \`xdg-desktop-portal-wlr\`, \`xdg-desktop-portal-gtk\`, \`grim\`,
          \`slurp\`, \`polkit\`, \`gnome-keyring\` and \`wireplumber\`. It can
          be installed alongside \`cosmalia-session\`.

          ### Revert

          \`\`\`sh
          sudo pacman -R labctalia-session
          \`\`\`
          EOF
            )
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "$notes" \
              --verify-tag
          fi
