[preferred]
# xdg-desktop-portal reads this file because the session sets
# XDG_CURRENT_DESKTOP=labctalia:wlroots. It must be named
# labctalia-portals.conf; labwc-portals.conf is not consulted for that name.
#
# wlr uses wlr-screencopy/PipeWire for screenshots and screencasts.
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr

# gtk handles the desktop UI interfaces. Name them explicitly so the lookup
# does not fall through to "*" and pick the COSMIC backend (installed on some
# systems) for FileChooser/Settings.
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.DynamicLauncher=gtk
org.freedesktop.impl.portal.Lockdown=gtk
default=gtk

# gnome-keyring provides the Secret portal. Its .portal file still says
# UseIn=gnome, but UseIn is deprecated; naming the backend here selects it
# without pulling in the GNOME portal or Mutter.
org.freedesktop.impl.portal.Secret=gnome-keyring

# labwc's own portal configuration disables Inhibit: the gtk backend's
# inhibitor expects a GNOME session manager. Keep the same behaviour.
org.freedesktop.impl.portal.Inhibit=none
